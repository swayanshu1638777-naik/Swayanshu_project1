services:
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-college-portal:production
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PUBLISH_PORT:-5000}:5000"
    volumes:
      - portal-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  portal-data:
