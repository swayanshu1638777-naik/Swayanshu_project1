<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Smart College Portal</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .otp-container { width: 100%; max-width: 440px; padding: 1.5rem; }
        .otp-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .otp-icon {
            width: 64px; height: 64px; background: #dcfce7; color: #16a34a;
            border-radius: 18px; display: inline-flex; align-items: center;
            justify-content: center; font-size: 2rem; margin-bottom: 1.25rem;
        }
        .otp-input {
            letter-spacing: 0.5rem; font-size: 1.75rem; font-weight: 800; text-align: center;
            background-color: #eef2ff; border: 2px solid #cbd5e1; border-radius: 14px;
            padding: 0.8rem; width: 100%; color: #0f172a;
        }
        .btn-verify {
            background: #16a34a; color: #ffffff; border-radius: 12px; padding: 0.85rem;
            font-weight: 700; font-size: 1rem; width: 100%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem;
        }
    </style>
</head>
<body>
<div class="otp-container">
    <div class="otp-card">
        <div class="otp-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h2 style="font-weight: 800; color: #0f172a; font-size: 1.5rem; margin-bottom: 0.25rem;">Verify OTP Code</h2>
        <p style="color: #64748b; font-size: 0.9rem;">
            A 6-digit verification code was sent to your email address.
        </p>

        <form id="otpForm">
            <div class="form-group" style="margin-top: 1.25rem;">
                <input type="text" id="otp_input" class="otp-input" maxlength="6" required autofocus>
            </div>

            <button type="submit" class="btn-verify">
                <i class="fa-solid fa-circle-check"></i> Verify OTP & Activate Account
            </button>
        </form>

        <div style="margin-top: 1.25rem; font-size: 0.85rem; color: #64748b;">
            Didn't receive code? <a href="register.html" style="color: #2563eb; font-weight: 700;">Re-enter Details</a>
        </div>
    </div>
</div>

    <script src="js/portal.js"></script>
</body>
</html>
