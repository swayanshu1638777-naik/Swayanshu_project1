<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Smart College Portal</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .register-container { width: 100%; max-width: 650px; }
        .register-card {
            background-color: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            padding: 2.5rem 2rem;
            border: 1px solid #e2e8f0;
        }
        .register-header { text-align: center; margin-bottom: 2rem; }
        .register-logo {
            width: 64px; height: 64px; background: #2563eb; color: #ffffff;
            border-radius: 18px; display: inline-flex; align-items: center;
            justify-content: center; font-size: 2rem; margin-bottom: 1rem;
        }
        .styled-input, .styled-select {
            background-color: #eef2ff; border: 1px solid #cbd5e1;
            border-radius: 12px; padding: 0.75rem 1rem; font-size: 0.95rem; width: 100%;
        }
        .form-grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.25rem; }
        .btn-register {
            background: #2563eb; color: #ffffff; border-radius: 12px; padding: 0.9rem;
            font-weight: 700; font-size: 1.05rem; width: 100%; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-card">
        <div class="register-header">
            <div class="register-logo"><i class="fa-solid fa-user-graduate"></i></div>
            <h2 style="font-weight: 800; color: #0f172a; font-size: 1.75rem; margin-bottom: 0.25rem;">Student Self-Registration</h2>
            <p style="color: #64748b; font-size: 0.925rem;">Register your SSIPMT college account with email & phone OTP verification</p>
        </div>

        <form id="regForm">
            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="roll_no" class="styled-input" placeholder="e.g. 121" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="styled-input" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">College Email Address (@ssipmt.com)</label>
                    <input type="email" name="email" id="reg_email" class="styled-input" placeholder="Enter your college email" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" name="phone" id="reg_phone" class="styled-input" placeholder="e.g. 9876543210" pattern="[0-9]{10}" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Department</label>
                    <select name="department_id" class="styled-select" required>
                        <option value="">Enter college-provided ID</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Branch</label>
                    <select name="branch_id" class="styled-select" required>
                        <option value="">Enter college-provided ID</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Semester</label>
                    <select name="semester_id" class="styled-select" required>
                        <option value="">Enter college-provided ID</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Section</label>
                    <select name="section_id" class="styled-select" required>
                        <option value="">Enter college-provided ID</option>
                    </select>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-group">
                    <label class="form-label">Create Password</label>
                    <input type="password" name="password" id="reg_password" class="styled-input" placeholder="Minimum 8 characters" minlength="8" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" id="reg_confirm_password" class="styled-input" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn-register">
                <i class="fa-solid fa-paper-plane"></i> Send OTP & Proceed to Verification
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #64748b;">
            Already registered? <a href="login.html" style="color: #2563eb; font-weight: 700; text-decoration: none;">Sign In Here</a>
        </div>
        <div style="margin-top: 0.8rem; text-align: center; font-size: 0.9rem;">
            <a href="index.html" style="color: #2563eb; font-weight: 600; text-decoration: none;">← Back to campus home</a>
        </div>
    </div>
</div>

    <script src="js/portal.js"></script>
</body>
</html>
